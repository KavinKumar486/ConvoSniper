<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversniper</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px; /* Slightly narrower for a sleek look */
            width: 100%;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px 15px;
            width: 70%;
            border: 2px solid #3498db;
            border-radius: 25px 0 0 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #2980b9;
            box-shadow: 0 0 5px rgba(41, 128, 185, 0.5);
        }

        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 25px 25px 0;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        #show-insights-btn {
            display: none;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #show-insights-btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        #response-display {
            margin-top: 25px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            border: 2px solid #3498db;
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        #response-display p {
            color: #2c3e50;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        #approve-btn, #reject-btn {
            margin: 5px;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #approve-btn {
            background-color: #2ecc71;
            border: 2px solid #2ecc71;
            color: white;
        }

        #approve-btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        #reject-btn {
            background-color: #e74c3c;
            border: 2px solid #e74c3c;
            color: white;
        }

        #reject-btn:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        /* Animation for response display */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversniper</h1>
        <form action="/find_interests" method="GET">
            <input type="text" name="content" id="interest-input" placeholder="Enter interest (e.g., Python)">
            <button type="submit">Find Interests</button>
        </form>
        <button id="show-insights-btn" onclick="showInsights()">Show Insights</button>
        
        <div id="response-display">
            <p><strong>Response injected:</strong> <span id="injection-message"></span></p>
        </div>
    </div>

    <script>
        function showInsights() {
            window.location.href = '/show_insights';
        }
    </script>
</body>
</html>
